#hud .r{text-align:right}#hud .c{text-align:center;font-size:13px}

.cl[data-side=R] .b{right:calc(var(--x)*var(--u))}.cl[data-side=L] .b{left:calc(var(--x)*var(--u))}
.b.atk{background:radial-gradient(circle at 35% 28%,#ffa070,#d4401f 70%,#9e2a12)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE;
/* ================= ARMAS (do arquivo anexado) ================= */
const mk=(c,r,m)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m,flatShading:true});
const M={steel:mk(0xcbd4dc,.4,.7),dark:mk(0x8a949e,.5,.6),brass:mk(0xc9a24a,.4,.7),wood:mk(0x7a4a26,.8,0),dwood:mk(0x4a2c18,.85,0),leather:mk(0x2e1d12,.9,0),red:mk(0x7a1f1f,.8,0)};
function mesh(geo,mat,x,y,z){const m=new T.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);return m}
function blade(o){
  const n=o.n||10,L=o.L,ts=o.ts||.82,c=o.c||0,wb=o.wb,we=o.we,B=[],E=[];
  const tip=t=>t>ts?Math.max(0,(1-t)/(1-ts)):1;
  for(let i=0;i<=n;i++){
    const t=i/n,k=tip(t),sp=c*t*t,y=L*t;
    B.push([sp-wb(t,i)*k,y]);
    const e=we(t,i)*k;
    if(!(i==n&&e+wb(t,i)*k<1e-6))E.push([sp+e,y]);
  }
  const pts=B.concat(E.reverse()),s=new T.Shape();
  pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1]));
  const th=o.th||.008;
  const g=new T.ExtrudeGeometry(s,{depth:th,bevelEnabled:true,bevelThickness:th*.5,bevelSize:th*.4,bevelSegments:1});
  g.translate(0,0,-th/2);
  return mesh(g,o.bm||M.steel);
}
function sword(o){
  const g=new T.Group(),gl=o.grip||.12,gr=o.gr||.016;
  g.add(mesh(new T.CylinderGeometry(gr,gr*.88,gl,6),o.gm||M.wood,0,gl/2,0));
  for(let i=1;i<4;i++)g.add(mesh(new T.CylinderGeometry(gr*1.12,gr*1.12,.008,6),M.leather,0,gl*i/4,0));
  const pm=o.pm||M.brass;
  if(o.pom=='s')g.add(mesh(new T.SphereGeometry(o.pr||.026,6,4),pm,0,-.012,0));
  if(o.pom=='d')g.add(mesh(new T.CylinderGeometry(o.pr||.03,o.pr||.03,.02,8),pm,0,-.01,0));
  if(o.pom=='b')g.add(mesh(new T.BoxGeometry(.04,.03,.03),pm,0,-.015,0));
  (o.guard||[]).forEach(q=>{
    const gm=o.gmat||M.brass;
    if(q=='c')g.add(mesh(new T.BoxGeometry(o.gw||.13,.022,.03),gm,0,gl+.011,0));
    if(q=='cup'){const h=mesh(new T.SphereGeometry(o.cr||.055,8,4,0,Math.PI*2,0,Math.PI/2),gm,0,gl,0);h.material=gm.clone();h.material.side=T.DoubleSide;g.add(h)}
    if(q=='disc')g.add(mesh(new T.CylinderGeometry(o.dr||.05,o.dr||.05,.012,8),gm,0,gl+.006,0));
    if(q=='bow'){const r=gl/2,t=mesh(new T.TorusGeometry(r,.007,4,7,Math.PI),gm,0,r,0);t.rotation.z=-Math.PI/2;g.add(t)}
  });
  const b=blade(o.b);b.position.y=gl+.012;g.add(b);
  return g;
}
function axe(){
  const g=new T.Group();
  g.add(mesh(new T.CylinderGeometry(.018,.014,.38,6),M.wood,0,.19,0));
  for(let i=1;i<5;i++)g.add(mesh(new T.CylinderGeometry(.02,.02,.008,6),M.leather,0,.04+i*.04,0));
  g.add(mesh(new T.SphereGeometry(.026,6,4),M.dwood,0,-.01,0));
  g.add(mesh(new T.CylinderGeometry(.024,.024,.07,6),M.dark,0,.34,0));
  const s=new T.Shape();
  [[.02,.30],[.02,.40],[.05,.405],[.11,.44],[.125,.35],[.11,.26],[.05,.295]].forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1]));
  const th=.026,ge=new T.ExtrudeGeometry(s,{depth:th,bevelEnabled:true,bevelThickness:.006,bevelSize:.005,bevelSegments:1});
  ge.translate(0,0,-th/2);g.add(mesh(ge,M.steel));
  g.add(mesh(new T.BoxGeometry(.03,.05,.03),M.dark,-.03,.35,0));
  return g;
}
const K=v=>()=>v;
const W=[
 ['Sabre de abordagem',()=>sword({grip:.13,guard:['c','bow'],gw:.12,pom:'s',b:{L:.72,c:.09,wb:K(.008),we:t=>.026-.008*t,th:.008}})],
 ['Cutelo naval',()=>sword({grip:.11,guard:['disc'],dr:.055,pom:'d',gm:M.dwood,b:{L:.45,c:.04,ts:.75,wb:K(.012),we:t=>.04+.008*Math.sin(t*3),th:.012}})],
 ['Espada curta',()=>sword({grip:.1,guard:['c'],gw:.1,pom:'s',b:{L:.46,ts:.6,wb:t=>.02*(1+.5*Math.sin(Math.PI*t)),we:t=>.02*(1+.5*Math.sin(Math.PI*t)),th:.008}})],
 ['Espada de marinheiro',()=>sword({grip:.12,guard:['c'],gw:.13,gmat:M.dark,pm:M.dark,pom:'s',b:{L:.7,ts:.9,wb:K(.014),we:K(.014),th:.008}})],
 ['Rapieira',()=>sword({grip:.11,guard:['cup','c'],cr:.06,gw:.17,pom:'s',gm:M.leather,b:{L:.98,ts:.96,wb:K(.008),we:K(.008),th:.006}})],
 ['Florete',()=>sword({grip:.1,guard:['cup'],cr:.04,pom:'s',pr:.02,gm:M.red,b:{L:.9,ts:.97,wb:K(.006),we:K(.006),th:.005}})],
 ['Adaga de oficial',()=>sword({grip:.09,gr:.013,guard:['c'],gw:.08,pom:'s',pr:.02,b:{L:.27,ts:.5,wb:t=>.008+.014*Math.sin(Math.PI*Math.pow(t,.7)),we:t=>.008+.014*Math.sin(Math.PI*Math.pow(t,.7)),th:.007}})],
 ['Dirk escocês',()=>sword({grip:.1,guard:['disc'],dr:.045,pom:'d',pr:.034,gm:M.dwood,b:{L:.33,ts:.8,wb:K(.012),we:K(.012),th:.01}})],
 ['Adaga curva',()=>sword({grip:.09,gr:.013,guard:['c'],gw:.055,pom:'s',pr:.02,b:{L:.25,c:.07,ts:.6,wb:K(.006),we:t=>.026*(1-.2*t),th:.008}})],
 ['Faca de caça',()=>sword({grip:.11,gr:.015,guard:['c'],gw:.05,pom:'s',pr:.02,b:{L:.22,ts:.85,wb:t=>t<.65?.012:.012*Math.max(0,1-(t-.65)/.35),we:K(.02),th:.006}})],
 ['Faca de marinheiro',()=>sword({grip:.1,gr:.02,guard:[],gm:M.dwood,b:{L:.17,ts:.85,wb:K(0),we:K(.022),th:.006}})],
 ['Faca de açougueiro',()=>sword({grip:.11,guard:[],gm:M.dwood,b:{L:.27,ts:.88,wb:K(0),we:K(.04),th:.005}})],
 ['Faca kukri',()=>sword({grip:.11,guard:['disc'],dr:.03,pom:'d',pr:.026,b:{L:.34,c:.06,ts:.85,wb:K(.012),we:t=>.012+.04*Math.sin(Math.PI*Math.min(1,t*.9+.05)),th:.012}})],
 ['Machado de mão',axe],
 ['Sabre serrilhado',()=>sword({grip:.13,guard:['c','bow'],gw:.12,pom:'s',gmat:M.dark,pm:M.dark,b:{L:.64,c:.08,n:26,ts:.9,wb:K(.008),we:(t,i)=>.02+(i%2?.011:0),th:.008}})]
];
/* impunhadura | classe de postura | golpes | velocidade | dano | sangramento */
const META=[
 ['fwd','s',['s_diag','s_horiz','s_over','s_spin'],1,1],
 ['fwd','h',['h_over','h_side','h_hook','s_spin'],.9,1.3],
 ['fwd','s',['s_diag','d_jab','s_horiz','d_combo'],1.15,.8],
 ['fwd','s',['s_diag','s_over','s_horiz','f_riposte'],1,.9],
 ['fence','f',['f_lunge','f_flecha','f_finta','f_riposte'],1.1,.9],
 ['fence','f',['f_lunge','f_finta','f_flecha','f_riposte'],1.25,.7],
 ['fwd','d',['d_jab','d_cross','d_stab','d_combo'],1.2,.6],
 ['fwd','d',['d_stab','d_jab','d_cross','d_combo'],1.1,.8],
 ['rev','r',['r_up','r_sweep','d_cross','d_combo'],1.25,.6],
 ['fwd','d',['d_jab','d_cross','d_stab','d_combo'],1.2,.6],
 ['rev','r',['r_sweep','r_up','d_jab','d_combo'],1.2,.55],
 ['fwd','h',['h_chop2','h_over','h_side','d_stab'],.95,1.1],
 ['fwd','h',['h_hook','h_side','h_over','s_spin'],1,1.1],
 ['fwd','h',['h_over','h_side','h_hook','h_chop2'],.9,1.3],
 ['fwd','s',['s_diag','s_horiz','s_spin','s_over'],1,1,1]
];
const GRIPN={fwd:'Pegada clássica',fence:'Pegada de esgrima',rev:'Pegada reversa'};

/* ================= PERSONAGEM (blocos chanfrados) ================= */
function bb(w,h,d,b,col){
  const s=new T.Shape(),x=w/2-b,y=h/2-b;
  s.moveTo(-x,-y);s.lineTo(x,-y);s.lineTo(x,y);s.lineTo(-x,y);s.closePath();
  const g=new T.ExtrudeGeometry(s,{depth:Math.max(d-2*b,.001),bevelEnabled:true,bevelThickness:b,bevelSize:b,bevelSegments:1,steps:1});
  g.translate(0,0,-(d-2*b)/2);
  const fg=g.toNonIndexed();fg.computeVertexNormals();g.dispose();   // normais planas (Lambert r128 não tem flatShading)
  return new T.Mesh(fg,new T.MeshLambertMaterial({color:col}));
}
const GOLD=0xe0b84a,SK=0xf2c29b,WHT=0xf4f0e6;
function makeFighter(pal,fwd){
  const g=new T.Group(),root=new T.Group();g.add(root);g.rotation.y=fwd*Math.PI/2;
  const put=(m,x,y,z,p)=>{m.position.set(x,y,z);(p||root).add(m);return m};
  function leg(x){const hip=new T.Group();hip.position.set(x,1.1,0);root.add(hip);
    put(bb(.5,.5,.55,.09,pal.pa),0,-.2,0,hip);
    const knee=new T.Group();knee.position.set(0,-.45,0);hip.add(knee);
    put(bb(.44,.42,.48,.08,WHT),0,-.2,0,knee);
    const ank=new T.Group();ank.position.set(0,-.42,0);knee.add(ank);
    put(bb(.56,.3,.8,.08,0x1d1d22),0,-.08,.1,ank);put(bb(.58,.12,.3,.04,0x2a1d14),0,-.17,-.18,ank);
    return {hip,knee,ank}}
  const lR=leg(.28),lL=leg(-.28);
  const up=new T.Group();up.position.set(0,1.1,0);root.add(up);
  const U=(m,x,y,z)=>put(m,x,y-1.1,z,up);
  U(bb(1.26,1.1,.84,.14,pal.coat),0,1.65,0);U(bb(1.34,.5,.92,.1,pal.coat),0,1.0,0);
  U(bb(.52,.95,.06,.03,0xe9d9a8),0,1.65,.44);
  [1.95,1.7,1.45].forEach(y=>U(bb(.1,.1,.04,.02,GOLD),.34,y,.45));
  U(bb(1.32,.2,.9,.06,pal.sash),0,1.2,0);U(bb(.22,.2,.06,.03,GOLD),0,1.2,.47);U(bb(.55,.36,.12,.05,WHT),0,2.05,.44);
  function arm(x){const sh=new T.Group();sh.position.set(x,.95,0);up.add(sh);
    put(bb(.44,.5,.48,.09,pal.coat),0,-.2,0,sh);
    const elb=new T.Group();elb.position.set(0,-.42,0);sh.add(elb);
    put(bb(.4,.32,.44,.08,pal.coat),0,-.14,0,elb);put(bb(.5,.16,.54,.05,GOLD),0,-.32,0,elb);
    const hand=new T.Group();hand.position.set(0,-.42,0);elb.add(hand);
    put(bb(.38,.3,.42,.08,SK),0,-.1,0,hand);
    sh.elb=elb;sh.hand=hand;return sh}
  const aR=arm(.82),aL=arm(-.82);
  const grip=new T.Group();grip.position.set(0,-.1,0);aR.hand.add(grip);
  const head=new T.Group();head.position.set(0,1.1,0);up.add(head);
  put(bb(1.15,1.05,1.05,.2,SK),0,.55,0,head);
  if(pal.hat=='tri'){
    put(bb(1.7,.12,1.6,.05,0x1d1d22),0,1.12,0,head);put(bb(1.1,.42,1.0,.1,0x1d1d22),0,1.35,0,head);
    put(bb(.56,.34,.2,.06,0x1d1d22),0,1.3,.82,head);put(bb(.3,.34,.56,.06,0x1d1d22),-.8,1.28,-.2,head);put(bb(.3,.34,.56,.06,0x1d1d22),.8,1.28,-.2,head);
    put(bb(1.74,.05,1.64,.02,GOLD),0,1.19,0,head);
    put(bb(.3,.7,.3,.08,pal.hair),0,.35,-.6,head);
  }else{
    put(bb(1.2,.34,1.1,.12,pal.hair),0,1.0,-.02,head);put(bb(1.18,.1,1.08,.03,0xc23b3b),0,.82,0,head);
    put(bb(.8,.3,.14,.05,pal.hair),0,.18,.5,head);
  }
  put(bb(.2,.45,.9,.06,pal.hair),-.6,.72,-.05,head);put(bb(.2,.45,.9,.06,pal.hair),.6,.72,-.05,head);put(bb(1.1,.6,.3,.08,pal.hair),0,.6,-.5,head);
  put(bb(.2,.26,.06,.03,0x1b1b1b),-.28,.58,.55,head);put(bb(.2,.26,.06,.03,0x1b1b1b),.28,.58,.55,head);
  put(bb(.34,.08,.06,.03,0xa04a3a),0,.28,.55,head);put(bb(.16,.14,.1,.04,0xe5a883),0,.42,.56,head);
  put(bb(.14,.3,.14,.04,SK),-.62,.55,0,head);put(bb(.14,.3,.14,.04,SK),.62,.55,0,head);
  S.add(g);
  return {g,root,up,head,aR,aL,lR,lL,grip,fwd,x:0,hp:100,cur:null,mv:null,mt:0,cache:{},cool:0,ph:fwd,parry:0,dodge:0,ko:0,bleed:0,w:null,base:null,hold:null};
}

/* ================= POSES E GOLPES ================= */
const BASE={dz:0,dy:0,rx:0,yaw:-.35,tx:.05,ty:0,tz:0,hx:0,hy:.35,sx:-.9,sy:0,sz:.35,ex:-1.25,wx:-.5,wy:0,wz:0,osx:.2,osz:-.35,oex:-.8,rhx:-.4,rkx:.3,lhx:.35,lkx:.3};
const PK=Object.keys(BASE);

  f.lL.hip.rotation.x=P.lhx;f.lL.knee.rotation.x=P.lkx;f.lL.ank.rotation.x=-(P.lhx+P.lkx);

function step(f,dt,t){

    const u=Math.min(1,f.mt);tgt=evalK(f.mv.ps,u);
    if(MP!='guest')(m.h||[]).forEach(h=>{if(pv<h&&f.mt>=h)hitCheck(f,f===A?B:A,m)});
    f.parry=m.pw&&u>m.pw[0]&&u<m.pw[1]?1:0;f.dodge=m.dw&&u>m.dw[0]&&u<m.dw[1]?1:0;
    if(MP=='guest'){if(f.mt>1)f.mt=1}else if(f.mt>=1){
      if(m.step){f.x+=m.step*f.fwd;f.cur.dz-=m.step}

  applyPose(f,c);
}

  if(MP){MP=null;spRestore()}mpLeaving=false}
function mpMenu(msg){mpTeardown();
  mpScreen('<h2>🌐 Multiplayer online</h2><p class="sm">Duelo 1×1, melhor de 3, direto entre os dois navegadores (P2P). Armas iguais, sem upgrades: vence a habilidade.</p>'
   +(msg?'<p style="color:#d8473a"><b>'+msg+'</b></p>':'')
   +'<button id="mpHost" class="big">Criar sala</button><h3>Entrar numa sala</h3><p><input id="mpcode" maxlength="5" placeholder="CÓDIGO" autocomplete="off"> <button id="mpJoin">Entrar</button></p><p><button id="mpBack">Voltar</button></p>')}
async function mpHostStart(){
  mpScreen('<h2>Criando sala…</h2>');
  try{await loadPeer()}catch(e){return mpMenu('Não foi possível carregar a biblioteca P2P (PeerJS). Verifique sua conexão.')}
  await loadIce();mpIsHost=true;mkHost(0)}
function mkHost(n){
  mpCode=Array.from({length:5},()=>CH[Math.random()*CH.length|0]).join('');
  const p=peer=new Peer(PFX+mpCode,{config:{iceServers:ICE,iceCandidatePoolSize:4}});
  p.on('open',()=>{if(peer!==p)return;const link=location.origin+location.pathname+'?sala='+mpCode;
    mpScreen('<h2>Sala criada</h2><p class="sm">Passe o código (ou o link) para o seu rival:</p><p class="code">'+mpCode+'</p><p class="sm" style="word-break:break-all">'+link+'</p><p><button id="mpCopy">Copiar link</button></p><p class="sm">Aguardando o rival entrar…</p><button id="mpBack">Cancelar</button>')});
  p.on('connection',c=>{if(peer!==p)return;if(conn){c.close();return}conn=c;setupConn()});
  p.on('error',e=>{if(peer!==p)return;if(e.type=='unavailable-id'&&n<6){p.destroy();mkHost(n+1)}else mpMenu(errTxt(e))})}
async function mpJoin(code){
  code=(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!=5)return mpMenu('Código inválido (5 caracteres).');
  mpScreen('<h2>Conectando…</h2><p class="sm">Sala '+code+'</p><button id="mpBack">Cancelar</button>');
  try{await loadPeer()}catch(e){return mpMenu('Não foi possível carregar a biblioteca P2P (PeerJS). Verifique sua conexão.')}
  await loadIce();mpIsHost=false;const p=peer=new Peer({config:{iceServers:ICE,iceCandidatePoolSize:4}});
  p.on('open',()=>{if(peer!==p)return;conn=p.connect(PFX+code,{reliable:true,serialization:'json'});setupConn();
    mpTmo=setTimeout(()=>{if(peer===p&&(!conn||!conn.open))mpMenu(HAS_TURN?'Tempo esgotado. Verifique VPN/bloqueio de WebRTC e tente de novo.':'Tempo esgotado: falta configurar o servidor TURN (METERED_APP/METERED_KEY no código).')},30000)});
  p.on('error',e=>{if(peer===p)mpMenu(errTxt(e))})}
function setupConn(){const c=conn,op=()=>{if(conn!==c)return;clearTimeout(mpTmo);mpConnected()};
  if(c.open)op();else c.on('open',op);
  c.on('data',onNet);c.on('close',()=>{if(conn===c)mpDrop()});c.on('error',()=>{if(conn===c)mpDrop()})}
function mpDrop(){if(mpLeaving)return;
  if(!MP)return mpMenu('Conexão perdida.');
  rid++;st='over';document.body.dataset.st=st;$('intro').style.display='none';
  $('over').innerHTML='<div class="box"><h2>Conexão encerrada</h2><p class="sm">O rival saiu ou a conexão caiu.</p><button id="mpExit" class="big">Menu</button></div>';show('over')}
function mpConnected(){MP=mpIsHost?'host':'guest';mpS={me:0,op:0};mpRnd=1;mpW=0;mpBuild();mpStartPick()}
function mpBuild(){
  [A,B].forEach(f=>{S.remove(f.g);f.g.traverse(o=>{if(o.geometry)o.geometry.dispose()})});
  A=makeFighter(mpIsHost?PH:PG,1);B=makeFighter(mpIsHost?PG:PH,-1);FS=[A,B];
  [A,B].forEach(f=>{f.maxhp=f.hp=100;f.maxstam=f.stam=100;f.spdMult=f.dmgMult=1;f.sc=0});
  setWeapon(A,0);setWeapon(B,0);resetFighters();buildBtns();$('pn').textContent='Você';$('en').textContent='Rival';$('ew').textContent=''}
function mpStartPick(){
  rid++;st='pick';document.body.dataset.st=st;$('intro').style.display='none';
  A.hp=B.hp=100;A.stam=B.stam=100;resetFighters();
  mpRdy=mpOpRdy=mpRM=mpOpRM=mpDrawing=false;mpWin=null;$('rd').textContent='Rodada '+mpRnd+'/3';mpPickUI()}
function mpPickUI(){
  const ob=$('pick').firstChild,y=ob?ob.scrollTop:0;
  let h='<h2>Rodada '+mpRnd+' · Melhor de 3</h2><p>Placar: <b>Você '+mpS.me+' × '+mpS.op+' Rival</b></p><p class="sm">Armas iguais: cada um escolhe uma arma e, quando os dois estiverem prontos, o jogo sorteia qual será usada pelos dois.</p><h3>Sua arma</h3><div class="grid">';
  W.forEach((w,i)=>{h+='<button data-mw="'+i+'" class="'+(i==mpW?'on':'')+'"'+(mpRdy?' disabled':'')+'>'+w[0]+'<small>'+GRIPN[META[i][0]]+' · dano '+META[i][4]+'</small></button>'});
  h+='</div><p class="sm">'+(mpOpRdy?'Rival pronto ✔':'Rival escolhendo…')+'</p><button id="mpReady" class="big"'+(mpRdy?' disabled':'')+'>'+(mpRdy?'Aguardando rival…':'Pronto!')+'</button>';
  $('pick').innerHTML='<div class="box">'+h+'</div>';show('pick');const nb=$('pick').firstChild;if(nb)nb.scrollTop=y}
function mpTryDraw(){   // só o host sorteia
  if(!mpIsHost||!mpRdy||!mpOpRdy||mpDrawing)return;mpDrawing=true;
  const a=mpW,b=mpOpW,win=Math.random()<.5?a:b,wi=win==a?0:1,seq=[];
  for(let i=0;i<12;i++)seq.push(i%2);if(seq[11]!=wi)seq.push(wi);
  mpWin=win;netSend({t:'go',w:win,a,b,seq});mpDraw(a,b,win,seq)}
function mpDraw(a,b,win,seq){   // a = minha escolha, b = do rival; seq: 0 = minha, 1 = rival
  const my=rid;if(a==b){mpBegin(a,'Armas iguais: '+W[a][0]);return}
  $('pick').innerHTML='<div class="box"><h2>Sorteando a arma do duelo…</h2><div class="grid"><div class="card" id="c0"><small>Sua escolha</small><b>'+W[a][0]+'</b></div><div class="card" id="c1"><small>Escolha do rival</small><b>'+W[b][0]+'</b></div></div></div>';show('pick');
  let k=0;const tick=()=>{if(rid!==my||st!='pick')return;
    $('c0').classList.toggle('on',seq[k]==0);$('c1').classList.toggle('on',seq[k]==1);tone(500+seq[k]*200,.06,'square',.06);k++;
    if(k<seq.length)setTimeout(tick,40+k*k*2.2);
    else setTimeout(()=>{if(rid===my&&st=='pick')mpBegin(win,'Arma sorteada: '+W[win][0])},900)};tick()}
function mpBegin(w,msg){
  setWeapon(A,w);setWeapon(B,w);buildBtns();resetFighters();A.cool=B.cool=0;$('ew').textContent=W[w][0];az=.45;
  show('');st='intro';document.body.dataset.st=st;
  const it=$('intro');it.innerHTML='<b>Rodada '+mpRnd+'</b><br><small>'+msg+'</small>';it.style.display='block';
  if(MP=='host'){const my=rid;setTimeout(()=>{if(rid===my&&st=='intro'){it.style.display='none';st='fight';document.body.dataset.st=st;netSend({t:'fight'})}},2000)}}
function mpRoundEnd(d){if(MP!='host'||st!='fight')return;const win=d===A?'g':'h';netSend({t:'re',win});mpOnRE(win)}
function mpOnRE(win){
  const mine=(win=='h')==mpIsHost;if(mine)mpS.me++;else mpS.op++;
  st='roundend';document.body.dataset.st=st;const my=++rid;
  const it=$('intro');it.innerHTML='<b>'+(mine?'Você venceu a rodada!':'O rival venceu a rodada')+'</b><br><small>'+mpScoreTxt()+'</small>';it.style.display='block';
  setTimeout(()=>{if(rid!==my)return;it.style.display='none';
    if(mpS.me>=2||mpS.op>=2){const w=mpS.me>mpS.op;SFX.coin();st='over';document.body.dataset.st=st;
      $('over').innerHTML='<div class="box"><h2>'+(w?'🏴‍☠️ Você venceu o duelo!':'Você perdeu o duelo')+'</h2><p>Placar final: <b>Você '+mpS.me+' × '+mpS.op+' Rival</b></p><button id="mpRM" class="big">Revanche</button><br><button id="mpExit" class="big">Menu</button></div>';show('over')}
    else{mpRnd++;mpStartPick()}},2200)}
function mpTryRM(){if(mpRM&&mpOpRM){mpS={me:0,op:0};mpRnd=1;mpStartPick()}}
function remoteAct(id){   // host executa o comando do convidado (B)
  if(st!='fight'||B.ko||B.mv||!MV[id])return;
  if(!(['parry','dodge','ret','adv'].includes(id)||B.w.m[2].includes(id)))return;
  const c=cost(id);if(B.stam<c)return;B.stam-=c;start(B,id);if(MV[id].h)SFX.swing()}
function sendSnap(){const q=f=>[+f.x.toFixed(3),+f.hp.toFixed(1),+f.stam.toFixed(1),f.ko?1:0,f.bleed>0?1:0,f.mv?f.mv.id:0,f.mv?+Math.min(1,f.mt).toFixed(3):0];netSend({t:'s',a:q(A),b:q(B)})}
function netTick(){const n=performance.now();if(n-netT<50)return;netT=n;sendSnap()}
function netApply(f,s){   // convidado: aplica o estado do host (x espelhado)
  const x=-s[0];if(Math.abs(x-f.x)>.0005){f.cur.dz-=(x-f.x)*f.fwd;f.x=x}   // mantém a posição visual contínua
  f.hp=s[1];f.stam=s[2];if(s[3])f.ko=1;
  const id=s[5];
  if(id){if(!f.mv||f.mv.id!=id){start(f,id);f.mt=s[6];if(MV[id].h)SFX.swing()}else if(Math.abs(f.mt-s[6])>.08)f.mt=s[6]}
  else if(f.mv){if(f.mv.m.hold)f.hold=evalK(f.mv.ps,1);f.mv=null;f.parry=f.dodge=0}}
function onEv(e){const L=x=>x=='h'?B:A,d=L(e.d),a=L(e.a||e.d);
  if(e.k=='p'){spark(d,a,0xcfe8ff);SFX.parry();freeze=.07;shake=.15;floatT(d,'Aparada!','#8fd3ff')}
  else if(e.k=='d')floatT(d,'Esquiva','#ffe27a');
  else if(e.k=='h'){spark(d,a,0xd8473a);SFX.hit();freeze=.06+(e.v>14?.04:0);shake=.2+e.v*.012;floatT(d,'-'+e.v,d===A?'#ff6a5a':'#ffffff')}
  else if(e.k=='k')SFX.ko()}
function onNet(m){if(!m)return;
  switch(m.t){
    case 'rd':mpOpRdy=true;mpOpW=m.w;if(st=='pick'&&!mpDrawing)mpPickUI();mpTryDraw();break;
    case 'go':if(MP!='guest')break;mpDrawing=true;mpWin=m.w;mpDraw(m.b,m.a,m.w,m.seq.map(s=>1-s));break;
    case 'fight':if(MP!='guest')break;if(st=='pick'&&mpWin!=null)mpBegin(mpWin,'');
      $('intro').style.display='none';show('');st='fight';document.body.dataset.st=st;break;
    case 'c':if(MP=='host')remoteAct(m.id);break;
    case 's':if(MP=='guest'&&st=='fight'){netApply(A,m.b);netApply(B,m.a)}break;
    case 'ev':if(MP=='guest')onEv(m);break;
    case 're':if(MP=='guest')mpOnRE(m.win);break;
    case 'rm':mpOpRM=true;mpTryRM();break;
  }}
function mpClick(b){
  if(b.dataset.mw!==undefined){if(MP&&!mpRdy&&st=='pick'&&!mpDrawing){mpW=+b.dataset.mw;mpPickUI()}return true}
  const id=b.id;if(!id||id.slice(0,2)!='mp')return false;
  if(id=='mpOpen')mpMenu();
  else if(id=='mpHost')mpHostStart();
  else if(id=='mpJoin')mpJoin($('mpcode').value);
  else if(id=='mpBack'||id=='mpExit'){mpTeardown();menu()}
  else if(id=='mpCopy'){const l=location.origin+location.pathname+'?sala='+mpCode;
    try{navigator.clipboard.writeText(l).then(()=>b.textContent='Copiado!')}catch(e){b.textContent=mpCode}}
  else if(id=='mpReady'){if(MP&&!mpRdy&&st=='pick'){mpRdy=true;netSend({t:'rd',w:mpW});mpPickUI();mpTryDraw()}}
  else if(id=='mpRM'){mpRM=true;netSend({t:'rm'});b.disabled=true;b.textContent='Aguardando rival…';mpTryRM()}
  return true}
function mpAuto(){const q=new URLSearchParams(location.search).get('sala');if(q)mpJoin(q)}

/* --- inicialização / câmera / loop --- */
applyUp();A.hp=A.maxhp;A.stam=A.maxstam;spawn(0);resetFighters();buildBtns();menu();mpAuto();
let az=.45,el=.2,dist0=13,pt=null,mid=0;
const cv=R.domElement;
cv.onpointerdown=e=>{pt=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!pt)return;az-=(e.clientX-pt[0])*.008;el=Math.max(-.1,Math.min(1.2,el+(e.clientY-pt[1])*.006));pt=[e.clientX,e.clientY]};
cv.onpointerup=cv.onpointercancel=()=>pt=null;
cv.onwheel=e=>{e.preventDefault();dist0=Math.max(7,Math.min(22,dist0+e.deltaY*.01))};
function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const clk=new T.Clock();
(function loop(){requestAnimationFrame(loop);
  let dt=Math.min(clk.getDelta(),.05);const t=clk.elapsedTime;
  if(freeze>0){freeze-=dt;dt*=.12}
  if(st=='fight'){roundT+=dt;
    if(MP){[A,B].forEach(f=>{if(!f.ko)f.stam=Math.min(f.maxstam,f.stam+(f.mv?6:24)*dt)});if(MP=='host')netTick()}
    else{ai(B,A,dt);A.stam=Math.min(A.maxstam,A.stam+(A.mv?6:24)*dt);comboT-=dt;if(comboT<=0)combo=0}}
  syncBtns();
  if(st=='menu'||st=='shop'||st=='pick')az+=dt*.15;
  B.g.visible=st!='shop';
  step(A,dt,t);step(B,dt,t);
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.l-=dt;s.v.y-=9*dt;s.m.position.addScaledVector(s.v,dt);s.m.material.opacity=Math.max(0,s.l*2);
    if(s.l<=0){S.remove(s.m);s.m.material.dispose();sparks.splice(i,1)}}
  $('h0').style.width=Math.max(0,A.hp/A.maxhp*100)+'%';$('s0').style.width=(A.stam/A.maxstam*100)+'%';
  $('h1').style.width=Math.max(0,B.hp/B.maxhp*100)+'%';$('sc').textContent=MP?mpScoreTxt():'Pontos '+score;$('gd').textContent=MP?'':'Ouro '+gold;
  $('cb').textContent=MP?'':combo>1?'Combo ×'+combo+' (pontos ×'+cm().toFixed(2)+')':'';
  const tm=st=='shop'?A.x:(A.x+B.x)/2;mid+=(tm-mid)*Math.min(1,dt*4);
  const sep=st=='shop'?0:Math.abs(B.x-A.x),dd=Math.max(dist0,sep*2.4+4);
  shake*=Math.max(0,1-dt*9);
  C.position.set(mid+Math.sin(az)*Math.cos(el)*dd+(Math.random()-.5)*shake,2.2+Math.sin(el)*dd+(Math.random()-.5)*shake,Math.cos(az)*Math.cos(el)*dd);
  C.lookAt(mid,1.7,0);R.render(S,C)})();
</script>
